# Behind a reverse proxy (Nginx or Caddy on the server, possibly behind a Cloudflare Tunnel) the caller's address
# arrives in X-Forwarded-For. Only private and local addresses, which is where those proxies live, are trusted to
# supply it; the first address in the chain that is not one of them is the visitor.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;  # export-gate: allow (private range)
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Sign-in attempts are limited per address: guessing passwords gets slow, a person who mistypes is not affected.
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=password_recovery:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=password_confirm:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bootstrap:10m rate=5r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /web-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Realtime meeting audio goes to the gateway, the only service that holds the speech-to-text key.
    location ~ ^/api/v1/meetings/[^/]+/stream$ {
        proxy_pass http://meeting-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3900s;
        proxy_send_timeout 3900s;
    }

    location = /api/v1/auth/login {
        limit_req zone=signin burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_sign_ins;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_many_sign_ins {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"error":"TOO_MANY_SIGN_INS","message":"Quá nhiều lần đăng nhập. Hãy chờ một phút rồi thử lại.","details":[]}';
    }

    location = /api/v1/auth/password-reset/request {
        limit_req zone=password_recovery burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_password_resets;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_many_password_resets {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"error":"RATE_LIMITED","message":"Bạn đã yêu cầu quá nhiều lần. Hãy chờ một phút rồi thử lại.","details":[]}';
    }

    # First account of a fresh install (FR-SETUP-06): one-shot on the API side, slow here so it cannot be hammered.
    location = /api/v1/setup/bootstrap {
        limit_req zone=bootstrap burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/password-reset/confirm {
        limit_req zone=password_confirm burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_password_resets;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short links of posts (FR-MKT-12): the API redirects and counts; a short domain points its /p/ here too.
    location /p/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        # The app shell is never cached: the browser asks again on every load, so a deploy shows at the next
        # reload instead of hours later. The hashed assets below stay cached for a week.
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
